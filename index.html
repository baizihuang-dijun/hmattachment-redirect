<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HM Attachment — Redirecting</title>
  <meta http-equiv="refresh" content="3;url=https://www.hmattachment.com/">
  <link rel="canonical" href="https://www.hmattachment.com/">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex;align-items:center;justify-content:center;min-height:100vh;
         background:#fff;color:#111}
    .wrap{text-align:center;max-width:520px;padding:24px}
    .logo{max-width:240px;height:auto;margin-bottom:28px}
    h1{font-size:22px;font-weight:700;margin-bottom:12px;letter-spacing:.3px}
    p{font-size:16px;color:#555;margin-bottom:24px;line-height:1.5}
    a{color:#c41230;font-weight:600;text-decoration:none}
    a:hover{text-decoration:underline}
    .small{font-size:13px;color:#999;margin-top:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://www.hmattachment.com/brand/hm-attachment-logo.png"
         alt="HM Attachment" class="logo" onerror="this.style.display='none'">
    <h1>We have moved</h1>
    <p>Our official website is now at <a href="https://www.hmattachment.com/">www.hmattachment.com</a>.</p>
    <p class="small">If you are not redirected automatically in 3 seconds, click the link above.</p>
  </div>
  <script>window.location.replace("https://www.hmattachment.com/");</script>
</body>
</html>
